name: Flutter Android Build & Release

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'builds/**'
  pull_request:

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | xargs)
          VCODE=$(grep '^version:' pubspec.yaml | sed 's/.*+//' | xargs)
          echo "vname=$VERSION" >> $GITHUB_OUTPUT
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT

      - name: Create api_keys.dart from secret
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          cat > lib/src/config/api_keys.dart << EOF
          // ignore_for_file: constant_identifier_names
          const List<String> geminiApiKeys = ['${GEMINI_API_KEYS}'];
          const String geminiModelName = 'gemini-flash-latest';
          EOF

      # The signing config in android/app/build.gradle.kts points at
      # ../../debug.keystore (i.e. the repo root). It's committed, so the
      # checkout step already places it where Gradle expects.
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Copy APKs to builds directory and update release metadata
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.vname }}"
          VCODE="${{ steps.version.outputs.vcode }}"
          BRANCH="${{ github.ref_name }}"
          mkdir -p builds
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            if [[ $(basename "$apk") == "app-release.apk" ]]; then
              continue
            fi
            ABI=$(basename "$apk" | sed 's/app-//' | sed 's/-release.apk//')
            cp "$apk" "builds/missions-v${VERSION}-${ABI}.apk"
          done

          # Automatically update update_info.json and latest.json
          cat > builds/update_info.json << EOF
          {
            "version_code": ${VCODE},
            "version_name": "${VERSION}",
            "published_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "min_supported_version_code": 2026010101,
            "apk_filename": "missions-v${VERSION}-arm64-v8a.apk",
            "apk_url": "https://raw.githubusercontent.com/ihjas-ahammed/Arcane/${BRANCH}/builds/missions-v${VERSION}-arm64-v8a.apk",
            "apk_arch_urls": {
              "arm64-v8a": "https://raw.githubusercontent.com/ihjas-ahammed/Arcane/${BRANCH}/builds/missions-v${VERSION}-arm64-v8a.apk",
              "armeabi-v7a": "https://raw.githubusercontent.com/ihjas-ahammed/Arcane/${BRANCH}/builds/missions-v${VERSION}-armeabi-v7a.apk",
              "x86_64": "https://raw.githubusercontent.com/ihjas-ahammed/Arcane/${BRANCH}/builds/missions-v${VERSION}-x86_64.apk"
            },
            "changelog_url": "https://raw.githubusercontent.com/ihjas-ahammed/Arcane/${BRANCH}/builds/latest.md"
          }
          EOF
          cp builds/update_info.json builds/latest.json
          if [ -f latest.md ]; then
            cp latest.md builds/latest.md
          fi
          ls -lh builds/

      - name: Commit and push builds to repository
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: add Android builds v${{ steps.version.outputs.vname }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: builds/missions-*.apk
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated release from `main`.
            Version: ${{ steps.version.outputs.vname }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
