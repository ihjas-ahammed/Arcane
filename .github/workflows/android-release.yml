name: Flutter verification
on:
  push:
    branches: ['**']
    paths-ignore: ['builds/**', '**.md']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
# Releases are prepared locally with scripts/release.sh using the private
# signing key and the existing Android signing certificate.
